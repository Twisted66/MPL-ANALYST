[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl-ph-predictor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "numpy>=2.0",
  "scikit-learn>=1.5"
]

[tool.setuptools.packages.find]
where = ["src"]
